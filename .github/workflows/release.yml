name: Build release artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install -e ".[dev,generation]"
      - name: Verify release tag
        run: python -c "import os, tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; raise SystemExit(0 if os.environ['GITHUB_REF_NAME']==f'v{version}' else 1)"
      - name: Check and build
        run: |
          python scripts/generate.py
          git diff --exit-code
          ruff check .
          ruff format --check .
          mypy
          pytest
          python -m build
          python -m twine check dist/*
      - name: Attest artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Retain artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rafiki-py-${{ github.event.release.tag_name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: python-release
      url: https://pypi.org/project/heyrafiki/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rafiki-py-${{ github.event.release.tag_name }}
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
