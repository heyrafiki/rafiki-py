name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: python-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Check style and types
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: Test package
        run: pytest
      - name: Inspect distributions
        run: |
          python -m build
          python -m twine check dist/*

  generated-source:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install generation tools
        run: python -m pip install -e ".[dev,generation]"
      - name: Verify generated source
        run: |
          python scripts/generate.py
          git diff --exit-code

  dependency-review:
    if: ${{ github.event_name == 'pull_request' && github.event.repository.private == false }}
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
